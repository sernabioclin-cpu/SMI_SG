:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ok:#7fc492; --ok-soft:#1f3326; --warn:#e3b764; --warn-soft:#3a2f17; --bad:#ef8f8f; --bad-soft:#3d2020; --info:#8fb3e6; --info-soft:#1e2a3b; color-scheme:dark}}

  --bg:#1a1817; --surface:#232120; --sunk:#2b2827; --line:#3d3936; --fg:#ece8e4; --muted:#a59e97;
  --guinda:#d9879c; --guinda-soft:#3a2229; --dorado:#d4b281; --dorado-soft:#332b20;
  --ok:#7fc492; --ok-soft:#1f3326; --warn:#e3b764; --warn-soft:#3a2f17; --bad:#ef8f8f; --bad-soft:#3d2020; --info:#8fb3e6; --info-soft:#1e2a3b; color-scheme:dark}
*{box-sizing:border-box}
a{color:var(--guinda)}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{border-bottom:3px solid var(--dorado);background:var(--surface)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding-block:14px}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.brand h1{margin:0;font-size:19px;color:var(--guinda);text-wrap:balance}
.deadline{font-size:13px;color:var(--muted);text-align:right}
.deadline b{color:var(--bad);font-variant-numeric:tabular-nums}
nav.views{display:flex;gap:4px;flex-wrap:wrap;padding-block:10px}
nav.views a{padding:6px 12px;border-radius:6px;color:var(--fg);text-decoration:none;border:1px solid transparent}
nav.views a[aria-current="page"]{background:var(--guinda-soft);color:var(--guinda);border-color:var(--guinda);font-weight:600}
nav.views a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--dorado);outline-offset:2px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;padding-block:8px 48px}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.list{display:flex;flex-direction:column;gap:14px}
aside.list h3{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.svc-link{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.svc-link + .svc-link{margin-top:4px}
.svc-link[aria-current="true"]{border-color:var(--guinda);box-shadow:inset 3px 0 0 var(--guinda)}
.svc-link span.n{min-width:0;overflow-wrap:anywhere}
.chip{display:inline-block;flex:none;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.st-vacio{background:var(--sunk);color:var(--muted)}
.st-borrador{background:var(--info-soft);color:var(--info)}
.st-listo{background:var(--warn-soft);color:var(--warn)}
.st-validado{background:var(--ok-soft);color:var(--ok)}
.st-observado{background:var(--bad-soft);color:var(--bad)}
main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.panel + .panel{margin-top:14px}
h2{font-size:18px;margin:0 0 4px;color:var(--guinda);text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px}
.notice{border-left:3px solid var(--dorado);background:var(--dorado-soft);padding:10px 14px;border-radius:4px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
.sec{margin-top:18px}
.sec > h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dorado);border-bottom:1px solid var(--line);padding-bottom:4px}
.q{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.q:last-child{border-bottom:0}
.q .qt{font-weight:500}
.q .qid{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
.q .req{color:var(--bad)}
.q .help{font-size:12px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;background:var(--surface)}
.opts input{accent-color:var(--guinda)}
.opts label:has(input:checked){border-color:var(--guinda);background:var(--guinda-soft);color:var(--guinda);font-weight:600}
.inline{display:flex;flex-wrap:wrap;gap:8px}
.inline > label{flex:1 1 120px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:var(--sunk);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0}
tr.grp td{background:var(--dorado-soft);font-weight:600;font-size:12px;color:var(--fg)}
td.num{width:130px}
td.num input{text-align:right}
.tnum{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.btn{font:inherit;font-size:13px;border-radius:6px;padding:7px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--guinda);border-color:var(--guinda);color:var(--surface)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--dorado)}
.status-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:6px;background:var(--sunk);margin-top:16px}
.saving{font-size:12px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.summary div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.summary b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.summary span{font-size:12px;color:var(--muted)}
.res-svc{margin-top:18px}
.res-svc h3{font-size:15px;margin:0 0 6px;color:var(--guinda)}
.res-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px}
.res-row .a{font-weight:600;overflow-wrap:anywhere;white-space:pre-wrap}

.empty{color:var(--muted);font-style:italic}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:20}
.dbwarn{background:var(--bad-soft);color:var(--bad);padding:8px 14px;border-radius:6px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Question model ---------- */
function oficialKind(t){
  if(/6 enteros/.test(t))return"six";
  if(/Mínimo y máximo/.test(t))return"minmax";
  if(/Lunes a viernes/.test(t))return"days";
  if(/Plazo y unidad/.test(t))return"plazo";
  if(/Diario \/ Cada tercer/.test(t))return"freq";
  if(/^Selección múltiple/.test(t))return"etapas";
  if(/^Selección$/.test(t))return"modalidad";
  if(/S[ií] ?\/ ?No/.test(t))return"yesno";
  if(/^(Número|Entero|Decimal)/.test(t)&&!/concepto|producto/.test(t))return"number";
  return"text";
}
function yesnoOpts(t){const o=[["SI","Sí"],["NO","No"]];if(/No se ha entregado/.test(t))o.push(["NE","No se ha entregado"]);if(/No se cuenta/.test(t))o.push(["NI","No se cuenta con información"]);return o}
function yesnoDetail(t){return /detalle|descripción|renglones|renglón|edición por concepto/.test(t)}
function textHint(t){
  if(/concepto|producto|Matriz|Tabla|Listado|registros|por equipo|Equipo \+|Selección de equipos/.test(t))return"Anote una línea por concepto (concepto · cantidad mínima · cantidad máxima · motivo). En la plataforma se captura en tabla.";
  if(/Horario/.test(t))return"Ejemplo: recolección 7:00–9:00, entrega 15:00–17:00.";
  return"";
}
function questionsFor(s){ // normalized list: {id,sec,x,kind,opts,req,help,min,max,cond,detail}
  const out=[];
  if(s.b==="M"){ for(const q of DATA.smiQ) out.push(normPreg(q)); }
  else if(s.p){ for(const q of s.p) out.push(normPreg(q)); }
  else if(s.q){
    let first=null;
    for(const q of s.q){
      const [id,t,x,a,b]=q; if(/-ID-/.test(id))continue;
      let cond=null;
      if(s.t!=="OX"){ if(!first&&/S[ií] ?\/ ?No/.test(t)) first=id; else if(first) cond={p:first,v:/no requiere el servicio/i.test(x)?["NO"]:["SI"]}; } const k=oficialKind(t);
      let mod=s.t==="OX"?a:null;
      out.push({id,sec:mod&&mod!=="Ambas"?("Modalidad "+mod.toLowerCase()):"Cuestionario oficial",x,kind:k,t,opts:k==="yesno"?yesnoOpts(t):null,detail:k==="yesno"&&yesnoDetail(t),
        req:k==="text"?/obligatori/i.test(t):!/opcional/i.test(t),help:k==="text"?textHint(t):"",max:s.t==="OX"?null:(typeof b==="number"?b:null),mod,cond});
    }
  }
  return out;
}
function normPreg(q){
  const kind=q.t==="SI_NO"?"yesno":q.t==="OPCION"?"radio":q.t==="MULTIPLE"?"multi":q.t==="NUMERO"?"number":"text";
  return {id:q.k,sec:SECNAMES[q.s]||q.s,x:q.x,kind,opts:q.op||(kind==="yesno"?[["SI","Sí"],["NO","No"]]:null),req:!!q.o,help:q.a||"",cond:q.c};
}
function visible(q,a){ if(!q.cond)return true; let v=a[q.cond.p]; if(v&&typeof v==="object"&&!Array.isArray(v))v=v.v; const arr=Array.isArray(v)?v:v==null?[]:[String(v)]; return arr.some(x=>q.cond.v.includes(x)); }
function answered(v){ if(v==null)return false; if(Array.isArray(v))return v.length>0; if(typeof v==="object")return Object.values(v).some(x=>x!==""&&x!=null&&!(Array.isArray(x)&&!x.length)); return String(v).trim()!==""; }

/* ---------- State & progress ---------- */
function doc(c){ return state[c]||(state[c]={a:{},v:{},cx:{},j:{},resp:{},estado:"vacio"}); }
function progress(s){
  if(s.conc){const ps=SUBS(s.c).map(progress);const tot=ps.reduce((a,p)=>a+p.tot,0),done=ps.reduce((a,p)=>a+p.done,0);return{tot,done,pct:tot?Math.round(done*100/tot):0}}
  const d=doc(s.c), qs=questionsFor(s).filter(q=>visible(q,d.a||{}));
  let tot=qs.length, done=qs.filter(q=>answered((d.a||{})[q.id])).length;
  if(s.v){tot+=s.v.length; done+=s.v.filter((_,i)=>answered((d.v||{})[i])).length;}
  if(s.cx){tot+=s.cx.length; done+=s.cx.filter(r=>answered((d.cx||{})[r[4]])||answered((d.cx||{})[r[5]])).length;}
  return {tot,done,pct:tot?Math.round(done*100/tot):0};
}
function estadoOf(s){ if(s.conc){const es=SUBS(s.c).map(estadoOf); if(es.every(e=>e==="validado"))return"validado"; if(es.includes("observado"))return"observado"; if(es.every(e=>e==="listo"||e==="validado"))return"listo"; return es.every(e=>e==="vacio")?"vacio":"borrador";}
  const d=doc(s.c); if(d.estado&&d.estado!=="vacio")return d.estado; return progress(s).done>0||answered(d.resp&&d.resp.nombre)?"borrador":"vacio"; }

function deepMerge(t,p){for(const k in p){if(p[k]&&typeof p[k]==="object"&&!Array.isArray(p[k])){t[k]=t[k]&&typeof t[k]==="object"?t[k]:{};deepMerge(t[k],p[k])}else t[k]=p[k]}return t}
async function api(body){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({k:KEY,...body})});
  const j=await r.json(); if(!j.ok) throw Object.assign(new Error(j.error||"error"),{code:j.error}); return j;
}
function patch(c,p,now){
  deepMerge(doc(c),p); pend[c]=deepMerge(pend[c]||{},JSON.parse(JSON.stringify(p)));
  setSaving("Guardando…"); clearTimeout(timers[c]); timers[c]=setTimeout(()=>flush(c),now?0:1200);
}
function patchU(p){deepMerge(unidad,p);pend.__unidad=deepMerge(pend.__unidad||{},JSON.parse(JSON.stringify(p)));setSaving("Guardando…");clearTimeout(timers.__unidad);timers.__unidad=setTimeout(()=>flush("__unidad"),1200)}
async function flush(c){
  if(flushing[c]||!pend[c])return;
  const p=pend[c]; delete pend[c]; flushing[c]=true;
  try{
    const j=await api(c==="__unidad"?{op:"unidad",patch:p}:{op:"guardar",c,patch:p});
    if(c!=="__unidad"&&j.doc&&!pend[c]){const d=doc(c);d.estado=j.doc.estado;d.ts=j.doc.ts;d.validadoTs=j.doc.validadoTs;renderSidebar()}
    setSaving("Guardado "+new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    if(e.code==="sin_permiso"||e.code==="enlace_invalido"){showDb("Este enlace no permite guardar ese dato.");}
    else{pend[c]=deepMerge(p,pend[c]||{});setSaving("Sin conexión; reintentando…");setTimeout(()=>flush(c),4000)}

function fmtAns(q,v){
  if(!answered(v))return"";
  if(q.opts&&!Array.isArray(v)&&typeof v!=="object"){const o=q.opts.find(x=>x[0]===v);return o?o[1]:v}
  if(q.kind==="yesno"&&typeof v==="object"){const o=q.opts.find(x=>x[0]===v.v);return (o?o[1]:"")+(v.d?" — "+v.d:"")}
  if(Array.isArray(v)){const map={LV:"Lunes a viernes",SAB:"Sábados",DOM:"Domingos",REC:"Recolección",TRA:"Transporte",TRT:"Tratamiento",DIS:"Disposición final"};return v.map(x=>(q.opts&&(q.opts.find(o=>o[0]===x)||[])[1])||map[x]||x).join(", ")}
  if(q.kind==="modalidad")return({H:"Hospitalario",D:"Domiciliario",A:"Ambas"})[v]||v;
  if(typeof v==="object")return Object.entries(v).filter(([,x])=>answered(x)).map(([k,x])=>`${({min:"mín.",max:"máx.",mmin:"matutino mín.",mmax:"matutino máx.",vmin:"vespertino mín.",vmax:"vespertino máx.",nmin:"nocturno mín.",nmax:"nocturno máx.",n:"",u:"",f:"",t:""})[k]??k} ${x}`.trim()).join(" · ");
  return String(v);
}
function rowsFor(s){
  if(s.conc){const subs=SUBS(s.c),out=[["Responsable","Concentrado: "+subs.map(x=>x.area+" ("+((doc(x.c).resp||{}).nombre||x.r)+")").join("; ")]];
    for(const q of questionsFor(s)){const parts=subs.map(x=>{const a=doc(x.c).a||{};const f=visible(q,a)?fmtAns(q,a[q.id]):"";return f?x.area+": "+f:""}).filter(Boolean); if(parts.length) out.push([q.id+" · "+q.x,parts.join(" | ")]);}
    s.v.forEach(([g,n],i)=>{const sm=sumVar(s,i); if(sm!=="")out.push([g+" · "+n,String(sm)])}); return out;}
  const d=doc(s.c), a=d.a||{}, out=[];
  out.push(["Responsable",((d.resp||{}).nombre||"")+((d.resp||{}).cargo?", "+d.resp.cargo:"")]);
  for(const q of questionsFor(s)) if(visible(q,a)&&answered(a[q.id])) out.push([q.id+" · "+q.x,fmtAns(q,a[q.id])]);
  if(s.v) s.v.forEach(([g,n],i)=>{if(answered((d.v||{})[i]))out.push([g+" · "+n,String(d.v[i])])});
  if(s.cx) s.cx.forEach(r=>{const v=d.cx||{};if(answered(v[r[4]])||answered(v[r[5]]))out.push([`${r[1]} (${r[2]}, ${r[3]})`,`mín. ${v[r[4]]??"—"} · máx. ${v[r[5]]??"—"}${(d.j||{})[r[4]]?" — "+d.j[r[4]]:""}`])});
  return out;
}

function route(){
  if(!USER)return;
  let h=(location.hash||"").slice(1);
  const okSvc=h.startsWith("s-")&&MIS.includes(h.slice(2));
  if(!okSvc&&!(isBoss()&&["tablero","unidad","resumen"].includes(h))) h=isBoss()?"tablero":"s-"+MIS[0];
  current=h;
  document.querySelectorAll("nav.views a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===h?"page":"false"));
  if(h.startsWith("s-")) renderService(h.slice(2)); else if(h==="unidad") renderUnidad(); else if(h==="resumen") renderResumen(); else renderTablero();
  renderSidebar();
}
function refreshVisibility(c){
  const s=BYC[c], a=doc(c).a||{};
  for(const q of questionsFor(s)){const w=document.querySelector(`[data-qwrap="${CSS.escape(q.id)}"]`); if(w) w.hidden=!visible(q,a);}
  const pr=progress(s), e=$("#prog"); if(e)e.textContent=`${pr.done} de ${pr.tot}`; const ec=$("#estchip"); if(ec)ec.innerHTML=chip(estadoOf(s));
  renderSidebar();
}
document.addEventListener("input",ev=>{
  const t=ev.target; if(!canWrite)return;
  const c=current.startsWith("s-")?current.slice(2):null;
  if(t.dataset.u){patchU({[t.dataset.u]:t.value});return}
  if(t.dataset.pri){patchU({prioridades:{[t.dataset.pri]:t.value}});return}
  if(!c)return;
  const d=doc(c);
  if(t.dataset.r){patch(c,{resp:{[t.dataset.r]:t.value}});return}
  if(t.dataset.nota){patch(c,{nota:t.value});return}
  if(t.dataset.v!=null){patch(c,{v:{[t.dataset.v]:t.value}});const s=BYC[c];$("#vcount").textContent=s.v.filter((_,i)=>answered((d.v||{})[i])).length;bumpEstado(c);refreshVisibility(c);return}
  if(t.dataset.cx){patch(c,{cx:{[t.dataset.cx]:t.value}});bumpEstado(c);refreshVisibility(c);return}
  if(t.dataset.j){patch(c,{j:{[t.dataset.j]:t.value}});return}
  if(t.dataset.q){
    const qid=t.dataset.q; let val;
    if(t.dataset.multi){val=[...document.querySelectorAll(`input[data-q="${CSS.escape(qid)}"][data-multi]:checked`)].map(x=>x.value)}
    else if(t.dataset.sub){const cur=(d.a||{})[qid];const o=cur&&typeof cur==="object"&&!Array.isArray(cur)?{...cur}:(cur!=null&&cur!==""?{v:cur}:{});o[t.dataset.sub]=t.value;val=o}
    else if(t.type==="radio"){const s=BYC[c];const q=questionsFor(s).find(x=>x.id===qid);if(q&&q.detail){const cur=(d.a||{})[qid];val={...(cur&&typeof cur==="object"?cur:{}),v:t.value}}else val=t.value}
    else val=t.value;
    patch(c,{a:{[qid]:val}},t.type==="radio"||t.type==="checkbox");bumpEstado(c);refreshVisibility(c);
  }
});
document.addEventListener("change",ev=>{ if(ev.target.type==="radio"||ev.target.type==="checkbox"||ev.target.tagName==="SELECT") ev.target.dispatchEvent(new Event("input",{bubbles:true})) ;},true);
function bumpEstado(c){const d=doc(c); if(!d.estado||d.estado==="vacio")patch(c,{estado:"borrador"}); else if(d.estado==="validado"){patch(c,{estado:"borrador"});toast("Cambió un servicio validado: vuelve a captura")}}
document.addEventListener("click",ev=>{
  const id=ev.target.id, c=current.startsWith("s-")?current.slice(2):null;
  if(id==="btnCsv"){downloadCsv();return}
  if(!c)return;
  if(id==="btnListo"){patch(c,{estado:"listo"},true);toast("Marcado listo para revisión del Director");route()}
  if(id==="btnVal"&&isBoss()){patch(c,{estado:"validado",validadoTs:new Date().toISOString()},true);toast("Servicio validado");route()}
  if(id==="btnObs"&&isBoss()){const n=($("#nota")||{}).value||"";if(!n.trim()){toast("Escriba las observaciones antes de devolver");$("#nota").focus();return}patch(c,{estado:"observado",nota:n},true);toast("Devuelto con observaciones");route()}
});
document.addEventListener("input",ev=>{ if(ev.target.id==="vfilter"){const f=ev.target.value.toLowerCase();document.querySelectorAll("tr[data-vrow]").forEach(r=>r.hidden=f&&!r.textContent.toLowerCase().includes(f))}});
window.addEventListener("hashchange",route);

function tick(){const end=new Date("2026-11-09T13:00:00-06:00"), ms=end-new Date(), e=$("#countdown"); if(ms<=0){e.textContent="Plazo vencido (9 nov, 13:00 h)";return} const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4); e.textContent=`Faltan ${h} h ${m} min · lunes 9 nov, 13:00 h`}
tick(); setInterval(tick,60000);

async function cargar(first){
  const j=await api({op:"cargar"});
  USER=j.usuario; MIS=j.usuario.servicios;
  for(const [c,d] of Object.entries(j.resp||{})) if(!pend[c]&&!flushing[c]) state[c]=d;
  if(j.unidad&&!pend.__unidad&&!flushing.__unidad) unidad=j.unidad;
  if(first){
    $("#quien").textContent=USER.nombre+(USER.rol==="jefe"?"":" · "+({director:"Director",admin:"Planeación y Calidad"})[USER.rol]);
    $("#nav").hidden=!isBoss();
  }
}
(async()=>{
  if(!KEY){$("#main").innerHTML='<div class="panel"><h2>Enlace incompleto</h2><p class="sub">Abra el enlace personal que le envió la Subdirección de Planeación y Calidad. Cada jefe tiene uno propio.</p></div>';return}
  if(API_URL.startsWith("PEGUE")){showDb("Falta configurar la dirección del servidor (API_URL).");return}
  $("#main").innerHTML='<div class="panel"><p class="sub">Cargando sus servicios…</p></div>';
  try{ await cargar(true); route(); }
  catch(e){ $("#main").innerHTML=e.code==="enlace_invalido"?'<div class="panel"><h2>Enlace no válido</h2><p class="sub">Este enlace no corresponde a ningún responsable. Solicite el suyo a Planeación y Calidad.</p></div>':'<div class="panel"><h2>No se pudo cargar</h2><p class="sub">Revise su conexión a internet y vuelva a abrir el enlace.</p></div>'; return }
  setInterval(async()=>{ const act=document.activeElement; if(Object.keys(pend).length||(act&&/INPUT|TEXTAREA|SELECT/.test(act.tagName)))return; try{await cargar(false); route()}catch(e){} }, isBoss()?60000:180000);
})();
</script>
</body>
